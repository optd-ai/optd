{
  "kind": "Relationship",
  "apiVersion": "optd.dev/v1",
  "metadata": { "name": "task_milestone" },
  "spec": {
    "from": { "resource": "task", "field": "id" },
    "to": { "resource": "project_milestone", "field": "id" },
    "cardinality": "many_to_one",
    "fields": {
      "note": { "type": "string" },
    },
    "axi": {
      "purpose": "Link tasks to milestones without embedding milestone state on the task.",
    },
  },
}
