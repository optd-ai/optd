{
  "kind": "Hook",
  "apiVersion": "optd.dev/v1",
  "metadata": {
    "name": "validate_lead",
  },
  "spec": {
    "script": "validate_lead.ts",
    "timeout": "2s",
    "permissions": {
      "net": false,
      "read": false,
      "write": false,
      "env": false,
      "run": false,
    },
    "output": {
      "schema": "validation.v1",
    },
    "attachments": [
      {
        "phase": "changeset.validate",
        "resource": "default.lead",
        "order": 100,
        "input": {
          "operation": "$operation",
          "proposed": "$proposed",
          "actor": "$actor",
        },
      },
    ],
    "axi": {
      "purpose": "validate_lead hook for CRM prototype.",
      "whenToUse": "Runs from metadata-driven attachment points; agents normally invoke actions instead.",
    },
  },
}
