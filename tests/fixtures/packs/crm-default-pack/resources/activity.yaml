{
  "kind": "Resource",
  "apiVersion": "optd.dev/v1",
  "metadata": {
    "name": "activity",
  },
  "spec": {
    "fields": {
      "subject": {
        "type": "string",
        "required": true,
      },
      "type": {
        "type": "string",
        "required": true,
      },
      "status": {
        "type": "string",
        "required": true,
      },
      "due_at": {
        "type": "timestamp",
      },
      "completed_at": {
        "type": "timestamp",
      },
      "owner_id": {
        "type": "string",
      },
      "lead_id": {
        "type": "string",
        "ref": "lead",
      },
      "opportunity_id": {
        "type": "string",
        "ref": "opportunity",
      },
      "contact_id": {
        "type": "string",
        "ref": "contact",
      },
    },
    "axi": {
      "list": {
        "fields": [
          "id",
          "subject",
          "type",
          "status",
        ],
      },
      "help": [
        "optctl query default.activity",
        "optctl metadata resource default.activity",
      ],
    },
  },
}
