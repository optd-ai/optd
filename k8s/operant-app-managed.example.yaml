apiVersion: v1
kind: Secret
metadata:
  name: operant-secrets
stringData:
  OPERANT_SECRET_MASTER_KEY: change-me-32-bytes-minimum
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operant-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operant
  template:
    metadata:
      labels:
        app: operant
    spec:
      containers:
        - name: operant
          image: operant:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: OPERANT_HOST
              value: 0.0.0.0
            - name: OPERANT_PORT
              value: "8789"
            - name: OPERANT_DATA_DIR
              value: /data
            - name: OPERANT_PG_BIN_DIR
              value: /usr/lib/postgresql/17/bin
          envFrom:
            - secretRef:
                name: operant-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: operant-data
---
apiVersion: v1
kind: Service
metadata:
  name: operant
spec:
  selector:
    app: operant
  ports:
    - name: http
      port: 8789
      targetPort: http
