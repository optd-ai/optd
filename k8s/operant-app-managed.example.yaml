# Create the required Secret out of band; do not commit either value:
# kubectl create secret generic operant-runtime \
#   --from-literal=OPERANT_BOOTSTRAP_TOKEN="$(openssl rand -base64 32)" \
#   --from-literal=OPERANT_SECRET_MASTER_KEY="$(openssl rand -base64 32)"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operant-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: operant
  template:
    metadata:
      labels:
        app: operant
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: operant
          image: registry.example/operant:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: OPERANT_HOST
              value: 0.0.0.0
            - name: OPERANT_PORT
              value: "8789"
            - name: OPERANT_DATA_DIR
              value: /data
            - name: OPERANT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: operant-runtime
                  key: OPERANT_BOOTSTRAP_TOKEN
            - name: OPERANT_SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: operant-runtime
                  key: OPERANT_SECRET_MASTER_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: operant-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operant
spec:
  selector:
    app: operant
  ports:
    - name: http
      port: 8789
      targetPort: http
