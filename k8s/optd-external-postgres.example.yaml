# PostgreSQL 17 or newer is required. Create this Secret out of band; the URL
# password must be URL-encoded and none of these values belong in source control:
# kubectl create secret generic optd-runtime \
#   --from-literal=OPTD_DATABASE_URL='postgres://optd:...@postgres.example.svc:5432/optd' \
#   --from-literal=OPTD_BOOTSTRAP_TOKEN="$(openssl rand -base64 32)" \
#   --from-literal=OPTD_SECRET_MASTER_KEY="$(openssl rand -base64 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: optd
  template:
    metadata:
      labels:
        app: optd
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
      containers:
        - name: optd
          image: registry.example/optd:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: OPTD_HOST
              value: 0.0.0.0
            - name: OPTD_PORT
              value: "8789"
            - name: OPTD_DATA_DIR
              value: /tmp/optd
            - name: OPTD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: optd-runtime
                  key: OPTD_DATABASE_URL
            - name: OPTD_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: optd-runtime
                  key: OPTD_BOOTSTRAP_TOKEN
            - name: OPTD_SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: optd-runtime
                  key: OPTD_SECRET_MASTER_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: optd
spec:
  selector:
    app: optd
  ports:
    - name: http
      port: 8789
      targetPort: http
