# PostgreSQL 17 or newer is required. Create this Secret out of band; the URL
# password must be URL-encoded and none of these values belong in source control:
# kubectl create secret generic operant-runtime \
#   --from-literal=OPERANT_DATABASE_URL='postgres://operant:...@postgres.example.svc:5432/operant' \
#   --from-literal=OPERANT_BOOTSTRAP_TOKEN="$(openssl rand -base64 32)" \
#   --from-literal=OPERANT_SECRET_MASTER_KEY="$(openssl rand -base64 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operant
  template:
    metadata:
      labels:
        app: operant
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1993
        runAsGroup: 1993
        fsGroup: 1993
      containers:
        - name: operant
          image: registry.example/operant:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8789
          env:
            - name: OPERANT_HOST
              value: 0.0.0.0
            - name: OPERANT_PORT
              value: "8789"
            - name: OPERANT_DATA_DIR
              value: /tmp/operant
            - name: OPERANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: operant-runtime
                  key: OPERANT_DATABASE_URL
            - name: OPERANT_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: operant-runtime
                  key: OPERANT_BOOTSTRAP_TOKEN
            - name: OPERANT_SECRET_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: operant-runtime
                  key: OPERANT_SECRET_MASTER_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: operant
spec:
  selector:
    app: operant
  ports:
    - name: http
      port: 8789
      targetPort: http
