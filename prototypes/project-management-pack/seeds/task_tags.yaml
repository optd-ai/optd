kind: Seed
apiVersion: optd.dev/v1
metadata:
  name: task_tags
spec:
  resource: optd/projects:task_tag
  key: name
  mode: changeset
  rows:
    - name: Bug
      color: red
    - name: Feature
      color: blue
    - name: Chore
      color: gray
    - name: Research
      color: purple
  axi:
    purpose: task tags guidance for the optd/projects pack.
    whenToUse:
      - Inspect seed task_tags behavior and guidance before relying on it.
    help:
      - optctl metadata seed optd/projects:task_tags
