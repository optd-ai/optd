kind: Seed
apiVersion: optd.dev/v1
metadata:
  name: task_stages
spec:
  resource: optd/projects:task_stage
  key: name
  mode: changeset
  rows:
    - name: todo
      state: todo
      sequence: 10
      folded: false
    - name: in_progress
      state: in_progress
      sequence: 20
      folded: false
    - name: blocked
      state: blocked
      sequence: 30
      folded: false
    - name: done
      state: done
      sequence: 90
      folded: true
  axi:
    purpose: task stages guidance for the optd/projects pack.
    whenToUse:
      - Inspect seed task_stages behavior and guidance before relying on it.
    help:
      - optctl metadata seed optd/projects:task_stages
