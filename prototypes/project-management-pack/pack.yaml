kind: Pack
apiVersion: optd.dev/v1
metadata:
  publisher: optd
  name: projects
  version: 0.1.0
spec:
  purpose: Project and task management resources for agent-operated work tracking.
  axi:
    purpose: Project and task management resources for agent-operated work tracking.
    home:
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      actions:
        - optd/projects:block_task
        - optd/projects:complete_task
        - optd/projects:start_task
      help:
        - optctl resources
        - optctl --project ${project} list optd/projects:project
        - optctl metadata pack optd/projects
