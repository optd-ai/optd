kind: Action
apiVersion: optd.dev/v1
metadata:
  name: complete_task
spec:
  input:
    task_id:
      type: string
      required: true
      format: uuid
    stage_id:
      type: string
      required: true
      format: uuid
    spent_hours:
      type: decimal
      minimum: "0.01"
      maximum: "24.00"
      precision: 4
      scale: 2
    entry_date:
      type: date
  reads:
    task:
      resource: task
      id_from: $action.input.task_id
      fields:
        - id
        - version
        - state
        - project_id
        - assignee_id
      required: true
  availability:
    resource: optd/projects:task
    states:
      - in_progress
      - blocked
  axi:
    purpose: Complete an in-progress or blocked task, clearing blocked_reason to an empty string and setting the done stage atomically.
    whenToUse:
      - Use optd/projects:complete_task when its declared operation should be staged.
    stageFirst: true
    examples:
      - optctl --workspace ${workspace} action stage optd/projects:complete_task --input action.json
    successHelp:
      - optctl changeset inspect ${stage_id}
