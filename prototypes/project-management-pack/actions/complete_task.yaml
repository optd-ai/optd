{
  "kind": "Action",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "complete_task",
  },
  "spec": {
    "input": {
      "task_id": {
        "type": "string",
        "required": true,
        "format": "uuid",
      },
      "stage_id": {
        "type": "string",
        "required": true,
        "format": "uuid",
      },
      "spent_hours": {
        "type": "string",
        "required": true,
      },
    },
    "axi": {
      "purpose": "Complete assigned project work and optionally write a spent_hours summary.",
      "help": [
        "optctl action stage operant/projects:complete_task --input '{\"task_id\":\"TASK_ID\",\"stage_id\":\"done\"}'",
      ],
    },
  },
}
