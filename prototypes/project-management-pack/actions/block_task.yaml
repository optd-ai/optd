kind: Action
apiVersion: optd.dev/v1
metadata:
  name: block_task
spec:
  input:
    task_id:
      type: string
      required: true
      format: uuid
    stage_id:
      type: string
      required: true
      format: uuid
    blocked_reason:
      type: string
      required: true
  reads:
    task:
      resource: task
      id_from: $action.input.task_id
      fields:
        - id
        - version
        - state
        - work_project_id
        - assignee_id
      required: true
  availability:
    resource: optd/projects:task
    states:
      - todo
      - in_progress
  axi:
    purpose: block task guidance for the optd/projects pack.
    whenToUse:
      - Use optd/projects:block_task when its declared operation should be staged.
    stageFirst: true
    examples:
      - optctl --project ${project} action stage optd/projects:block_task --input action.json
    successHelp:
      - optctl changeset inspect ${stage_id}
