kind: Lifecycle
apiVersion: optd.dev/v1
metadata:
  name: task_flow
spec:
  resource: optd/projects:task
  field: state
  states:
    - name: todo
    - name: in_progress
    - name: blocked
    - name: done
      terminal: true
  transitions:
    - name: todo_to_in_progress_1
      from:
        - todo
      to: in_progress
    - name: blocked_to_in_progress_2
      from:
        - blocked
      to: in_progress
    - name: todo_to_blocked_3
      from:
        - todo
      to: blocked
    - name: in_progress_to_blocked_4
      from:
        - in_progress
      to: blocked
    - name: in_progress_to_done_5
      from:
        - in_progress
      to: done
    - name: blocked_to_done_6
      from:
        - blocked
      to: done
    - name: blocked_to_todo_7
      from:
        - blocked
      to: todo
  axi:
    purpose: Task lifecycle; blocked to todo or done requires clearing blocked_reason to an empty string in the same transition.
    whenToUse:
      - Inspect lifecycle task_flow behavior and guidance before relying on it.
    help:
      - optctl metadata lifecycle optd/projects:task_flow
  initial: todo
