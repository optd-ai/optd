kind: Policy
apiVersion: optd.dev/v1
metadata:
  name: project_access
spec:
  default_assignment: all_projects
  rules:
    - name: projects_admin
      effect: allow
      roles:
        - optd/projects:projects_admin
      actions:
        - read
        - history.read
        - create
        - update
        - archive
        - transition
        - link
        - unlink
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Projects administrators may manage every Projects pack resource.
    - name: project_manager_approval
      effect: allow
      roles:
        - optd/projects:project_manager
      actions:
        - changeset.approval.decide
      resources:
        - system:changeset-approval
      axi:
        summary: Project managers may decide task-completion approvals.
    - name: project_manager
      effect: allow
      roles:
        - optd/projects:project_manager
      actions:
        - read
        - history.read
        - create
        - update
        - archive
        - transition
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Project managers may manage resources within their assigned Project boundary.
    - name: project_member_read
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - read
        - history.read
        - create
      resources:
        - optd/projects:project
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
      axi:
        summary: Project members may read project content and create work items in their boundary.
    - name: assigned_task_work
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - update
        - transition
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:task
      where: assignee_id == actor.id
      axi:
        summary: Project members may change only tasks assigned to their principal.
    - name: own_timesheet
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - read
        - create
        - update
      resources:
        - optd/projects:timesheet
      where: principal_id == actor.id
      axi:
        summary: Project members may manage only timesheets owned by their principal.
    - name: project_viewer
      effect: allow
      roles:
        - optd/projects:viewer
      actions:
        - read
        - history.read
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Viewers have read-only access within their assigned Project boundary.
  axi:
    purpose: Defines administrator, manager, member, assignee, owner, and viewer access.
    whenToUse:
      - Inspect Projects access before assigning a role at a Project boundary.
    help:
      - optctl metadata policy optd/projects:project_access
