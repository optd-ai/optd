kind: Policy
apiVersion: operant.dev/v1
metadata:
  name: project_access
spec:
  default_assignment: all_projects
  rules:
    - name: projects_admin
      effect: allow
      roles:
        - operant/projects:projects_admin
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - link
        - unlink
        - comment
        - action:operant/projects:block_task
        - action:operant/projects:complete_task
        - action:operant/projects:start_task
      resources:
        - operant/projects:project
        - operant/projects:project_member
        - operant/projects:project_milestone
        - operant/projects:task
        - operant/projects:task_stage
        - operant/projects:task_tag
        - operant/projects:timesheet_entry
      axi:
        summary: Projects administrators may manage every Projects pack resource.
    - name: project_manager
      effect: allow
      roles:
        - operant/projects:project_manager
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - comment
        - action:operant/projects:block_task
        - action:operant/projects:complete_task
        - action:operant/projects:start_task
      resources:
        - operant/projects:project
        - operant/projects:project_member
        - operant/projects:project_milestone
        - operant/projects:task
        - operant/projects:task_stage
        - operant/projects:task_tag
        - operant/projects:timesheet_entry
      axi:
        summary: Project managers may manage resources within their assigned Project boundary.
    - name: project_member_read
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - read
        - create
      resources:
        - operant/projects:project
        - operant/projects:project_milestone
        - operant/projects:task
        - operant/projects:task_stage
        - operant/projects:task_tag
      axi:
        summary: Project members may read project content and create work items in their boundary.
    - name: assigned_task_work
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - update
        - transition
        - comment
        - action:operant/projects:block_task
        - action:operant/projects:complete_task
        - action:operant/projects:start_task
      resources:
        - operant/projects:task
      where: assignee_id == actor.id
      axi:
        summary: Project members may change only tasks assigned to their principal.
    - name: own_timesheet
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - read
        - create
        - update
      resources:
        - operant/projects:timesheet_entry
      where: principal_id == actor.id
      axi:
        summary: Project members may manage only timesheets owned by their principal.
    - name: project_viewer
      effect: allow
      roles:
        - operant/projects:viewer
      actions:
        - read
      resources:
        - operant/projects:project
        - operant/projects:project_member
        - operant/projects:project_milestone
        - operant/projects:task
        - operant/projects:task_stage
        - operant/projects:task_tag
        - operant/projects:timesheet_entry
      axi:
        summary: Viewers have read-only access within their assigned Project boundary.
  axi:
    purpose: Defines administrator, manager, member, assignee, owner, and viewer access.
    whenToUse:
      - Inspect Projects access before assigning a role at a Project boundary.
    help:
      - optctl metadata policy operant/projects:project_access
