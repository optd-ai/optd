kind: Policy
apiVersion: operant.dev/v1
metadata:
  name: project_access
spec:
  default_assignment: all_projects
  rules:
    - name: projects_admin_access_1
      effect: allow
      roles:
        - operant/projects:projects_admin
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - link
        - unlink
        - comment
      resources:
        - operant/projects:timesheet_entry
        - operant/projects:task
        - operant/projects:project_milestone
        - operant/projects:task_tag
        - operant/projects:project
        - operant/projects:task_stage
    - name: project_manager_access_2
      effect: allow
      roles:
        - operant/projects:project_manager
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - comment
        - action:operant/projects:block_task
        - action:operant/projects:complete_task
        - action:operant/projects:start_task
      resources:
        - operant/projects:timesheet_entry
        - operant/projects:task
        - operant/projects:project_milestone
        - operant/projects:task_tag
        - operant/projects:project
        - operant/projects:task_stage
      where: "true"
    - name: project_member_access_3
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - read
      resources:
        - operant/projects:project
      where: visibility == "internal" || owner_id == actor.id
    - name: project_member_access_4
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - read
        - create
      resources:
        - operant/projects:task
        - operant/projects:project_milestone
      where: "false"
    - name: project_member_access_5
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - read
        - create
      resources:
        - operant/projects:timesheet_entry
      where: "false"
    - name: project_member_access_6
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - update
        - transition
        - comment
      resources:
        - operant/projects:task
      where: assignee_id == actor.id
    - name: project_member_access_7
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - create
      resources:
        - operant/projects:timesheet_entry
      where: actor_id == actor.id
    - name: project_member_access_8
      effect: allow
      roles:
        - operant/projects:project_member
      actions:
        - action:operant/projects:block_task
        - action:operant/projects:complete_task
        - action:operant/projects:start_task
      resources:
        - operant/projects:timesheet_entry
        - operant/projects:task
        - operant/projects:project_milestone
        - operant/projects:task_tag
        - operant/projects:project
        - operant/projects:task_stage
      where: "true"
    - name: viewer_access_9
      effect: allow
      roles:
        - operant/projects:viewer
      actions:
        - read
      resources:
        - operant/projects:project
        - operant/projects:task
        - operant/projects:task_stage
        - operant/projects:task_tag
      where: visibility == "internal"
  axi:
    purpose: project access guidance for the operant/projects pack.
