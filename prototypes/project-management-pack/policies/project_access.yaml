kind: Policy
apiVersion: optd.dev/v1
metadata:
  name: project_access
spec:
  default_assignment: all_workspaces
  rules:
    - name: projects_admin
      effect: allow
      roles:
        - optd/projects:projects_admin
      actions:
        - read
        - history.read
        - create
        - update
        - archive
        - transition
        - link
        - unlink
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Projects administrators may manage every Projects pack resource.
    - name: projects_archived_read
      effect: allow
      roles: [optd/projects:projects_admin, optd/projects:project_manager]
      actions: [read_archived]
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
        - optd/projects:task_tag_assignment
        - optd/projects:task_milestone
      axi:
        summary: Administrators and managers may read archived Projects content within their Workspace boundary.
    - name: project_relationship_read
      effect: allow
      roles:
        - optd/projects:projects_admin
        - optd/projects:project_manager
        - optd/projects:project_member
        - optd/projects:viewer
      actions: [read, history.read]
      resources:
        - optd/projects:task_tag_assignment
        - optd/projects:task_milestone
      axi:
        summary: Projects roles may read task tags and milestones within their Workspace boundary.
    - name: projects_admin_import
      effect: allow
      roles: [optd/projects:projects_admin]
      actions: [import]
      resources: [optd/projects:task]
      axi:
        summary: Administrators may import historical tasks with an explicit state and reason.
    - name: projects_admin_stages
      effect: allow
      roles: [optd/projects:projects_admin]
      actions: [seed:optd/projects:task_stages]
      resources: [optd/projects:task_stage]
      axi:
        summary: Administrators may initialize task stages.
    - name: projects_admin_tags
      effect: allow
      roles: [optd/projects:projects_admin]
      actions: [seed:optd/projects:task_tags]
      resources: [optd/projects:task_tag]
      axi:
        summary: Administrators may initialize task tags.
    - name: projects_admin_relationships
      effect: allow
      roles: [optd/projects:projects_admin]
      actions: [link, unlink]
      resources:
        - optd/projects:task_tag_assignment
        - optd/projects:task_milestone
      axi:
        summary: Projects administrators may manage task tags and milestones.
    - name: project_manager_approval
      effect: allow
      roles:
        - optd/projects:project_manager
        - optd/projects:projects_admin
      actions:
        - changeset.approval.decide
      resources:
        - system:changeset-approval
      axi:
        summary: Project managers may decide approvals requiring their role.
    - name: project_manager
      effect: allow
      roles:
        - optd/projects:project_manager
      actions:
        - read
        - history.read
        - create
        - update
        - archive
        - transition
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Project managers may manage resources within their assigned Workspace boundary.
    - name: project_member_read
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - read
        - history.read
        - create
      resources:
        - optd/projects:project
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
      axi:
        summary: Project members may read project content and create work items in their boundary.
    - name: assigned_task_work
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - update
        - transition
        - comment
        - action:optd/projects:block_task
        - action:optd/projects:complete_task
        - action:optd/projects:start_task
      resources:
        - optd/projects:task
      where: assignee_id == actor.id
      axi:
        summary: Project members may change only tasks assigned to their principal.
    - name: own_timesheet
      effect: allow
      roles:
        - optd/projects:project_member
      actions:
        - read
        - create
        - update
      resources:
        - optd/projects:timesheet
      where: principal_id == actor.id
      axi:
        summary: Project members may manage only timesheets owned by their principal.
    - name: project_viewer
      effect: allow
      roles:
        - optd/projects:viewer
      actions:
        - read
        - history.read
      resources:
        - optd/projects:project
        - optd/projects:project_member
        - optd/projects:project_milestone
        - optd/projects:task
        - optd/projects:task_stage
        - optd/projects:task_tag
        - optd/projects:timesheet
      axi:
        summary: Viewers have read-only access within their assigned Workspace boundary.
  axi:
    purpose: Defines administrator, manager, member, assignee, owner, and viewer access.
    whenToUse:
      - Inspect Projects access before assigning a role at a Workspace boundary.
    help:
      - optctl metadata policy optd/projects:project_access
