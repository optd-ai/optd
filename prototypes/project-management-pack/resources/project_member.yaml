kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: project_member
spec:
  fields:
    work_project_id:
      type: string
      required: true
      ref: operant/projects:project
    principal_id:
      type: string
      required: true
    member_role:
      type: string
      required: true
      enum:
        - manager
        - member
        - viewer
  constraints:
    - name: project_principal_membership
      kind: unique
      fields:
        - work_project_id
        - principal_id
  indexes:
    - name: project_member_principal
      fields:
        - principal_id
        - work_project_id
  axi:
    purpose: Records a principal's explicit membership and role in a work project.
    whenToUse:
      - Use project members to grant manager, member, or viewer access to a work project.
    identity:
      title: ${principal_id}
      subtitle: ${member_role}
      labelFields:
        - principal_id
        - member_role
    list:
      defaultFields:
        - id
        - work_project_id
        - principal_id
        - member_role
      empty:
        message: No project members found.
        help:
          - optctl --project ${project} create operant/projects:project_member --input object.json --stage
    detail:
      sections:
        - title: Membership
          fields:
            - work_project_id
            - principal_id
            - member_role
      help:
        - optctl --project ${project} view operant/projects:project_member ${id}
    search:
      fields:
        - principal_id
        - member_role
      examples:
        - optctl --project ${project} search operant/projects:project_member --text manager
      resultFields:
        - id
        - work_project_id
        - principal_id
        - member_role
    help:
      list:
        - optctl --project ${project} list operant/projects:project_member
      view:
        - optctl --project ${project} view operant/projects:project_member ${id}
      created:
        - optctl --project ${project} view operant/projects:project_member ${id}
