kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: project_member
spec:
  fields:
    project_id:
      type: string
      required: true
      ref: optd/projects:project
    principal_id:
      type: string
      format: uuid
      required: true
  constraints:
    - name: project_principal_membership
      kind: unique
      fields:
        - project_id
        - principal_id
  indexes:
    - name: project_member_principal
      fields:
        - principal_id
        - project_id
  axi:
    purpose: Records a principal's direct membership in a work project.
    whenToUse:
      - Use project members to record direct principal membership; use role assignments for authority.
    identity:
      title: ${principal_id}
      subtitle: ${project_id}
      labelFields:
        - principal_id
        - project_id
    list:
      defaultFields:
        - id
        - project_id
        - principal_id
      empty:
        message: No project members found.
        help:
          - optctl --workspace ${workspace} create optd/projects:project_member --input object.json --stage
    detail:
      sections:
        - title: Membership
          fields:
            - project_id
            - principal_id
      help:
        - optctl --workspace ${workspace} view optd/projects:project_member ${id}
    search:
      fields:
        - principal_id
      examples:
        - optctl --workspace ${workspace} search optd/projects:project_member --text ${principal_id}
      resultFields:
        - id
        - project_id
        - principal_id
    help:
      list:
        - optctl --workspace ${workspace} list optd/projects:project_member
      view:
        - optctl --workspace ${workspace} view optd/projects:project_member ${id}
      created:
        - optctl --workspace ${workspace} view optd/projects:project_member ${id}
