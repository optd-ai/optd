kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: project_member
spec:
  fields:
    work_project_id:
      type: string
      required: true
      ref: operant/projects:project
    principal_id:
      type: string
      format: uuid
      required: true
  constraints:
    - name: project_principal_membership
      kind: unique
      fields:
        - work_project_id
        - principal_id
  indexes:
    - name: project_member_principal
      fields:
        - principal_id
        - work_project_id
  axi:
    purpose: Records a principal's direct membership in a work project.
    whenToUse:
      - Use project members to record direct principal membership; use role assignments for authority.
    identity:
      title: ${principal_id}
      subtitle: ${work_project_id}
      labelFields:
        - principal_id
        - work_project_id
    list:
      defaultFields:
        - id
        - work_project_id
        - principal_id
      empty:
        message: No project members found.
        help:
          - optctl --project ${project} create operant/projects:project_member --input object.json --stage
    detail:
      sections:
        - title: Membership
          fields:
            - work_project_id
            - principal_id
      help:
        - optctl --project ${project} view operant/projects:project_member ${id}
    search:
      fields:
        - principal_id
      examples:
        - optctl --project ${project} search operant/projects:project_member --text ${principal_id}
      resultFields:
        - id
        - work_project_id
        - principal_id
    help:
      list:
        - optctl --project ${project} list operant/projects:project_member
      view:
        - optctl --project ${project} view operant/projects:project_member ${id}
      created:
        - optctl --project ${project} view operant/projects:project_member ${id}
