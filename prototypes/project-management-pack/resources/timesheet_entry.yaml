{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "timesheet_entry",
  },
  "spec": {
    "fields": {
      "task_id": {
        "type": "string",
        "required": true,
        "ref": "operant/projects:task",
      },
      "actor_id": {
        "type": "string",
        "required": true,
      },
      "hours": {
        "type": "decimal",
        "required": true,
      },
      "description": {
        "type": "string",
      },
      "entry_date": {
        "type": "date",
        "required": true,
      },
    },
    "axi": {
      "purpose": "Log auditable time spent against tasks.",
      "create": {
        "required_fields": [
          "task_id",
          "actor_id",
          "hours",
          "entry_date",
        ],
      },
    },
  },
}
