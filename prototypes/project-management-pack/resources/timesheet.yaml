kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: timesheet
spec:
  fields:
    task_id:
      type: string
      required: true
      ref: operant/projects:task
    principal_id:
      type: string
      format: uuid
      required: true
    hours:
      type: decimal
      required: true
      minimum: "0.01"
      maximum: "24.00"
      precision: 4
      scale: 2
    description:
      type: string
    entry_date:
      type: date
      required: true
  axi:
    purpose: Time logged by a principal against a task.
    whenToUse:
      - Use operant/projects:timesheet to record principal-owned task time.
    identity:
      title: ${task_id}
      labelFields:
        - task_id
    list:
      defaultFields:
        - id
        - task_id
        - principal_id
        - hours
        - description
      empty:
        message: No timesheet records found.
        help:
          - optctl --project ${project} create operant/projects:timesheet --input object.json
            --stage
    detail:
      sections:
        - title: Timesheet
          fields:
            - task_id
            - principal_id
            - hours
            - description
            - entry_date
      help:
        - optctl --project ${project} query operant/projects:timesheet --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query operant/projects:timesheet
      view:
        - optctl --project ${project} view operant/projects:timesheet ${id}
      created:
        - optctl --project ${project} view operant/projects:timesheet ${id}
