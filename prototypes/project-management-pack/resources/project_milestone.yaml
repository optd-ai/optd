{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "project_milestone",
  },
  "spec": {
    "fields": {
      "name": {
        "type": "string",
        "required": true,
      },
      "work_project_id": {
        "type": "string",
        "required": true,
        "ref": "operant/projects:project",
      },
      "deadline": {
        "type": "date",
      },
      "status": {
        "type": "string",
        "required": true,
        "enum": [
          "planned",
          "at_risk",
          "done",
        ],
      },
    },
    "axi": {
      "purpose": "Track milestone deadlines and status for a project.",
    },
  },
}
