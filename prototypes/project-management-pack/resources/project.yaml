kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: project
spec:
  fields:
    name:
      type: string
      required: true
    description:
      type: string
    status:
      type: string
      required: true
      enum:
        - active
        - on_hold
        - done
        - archived
    owner_id:
      type: string
      format: uuid
      required: true
    visibility:
      type: string
      required: true
      enum:
        - private
        - members
        - internal
    start_date:
      type: date
    target_date:
      type: date
  axi:
    purpose: project guidance for the optd/projects pack.
    whenToUse:
      - Use optd/projects:project when working with project records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - description
        - status
        - owner_id
      empty:
        message: No project records found.
        help:
          - optctl --project ${project} create optd/projects:project --input object.json --stage
    detail:
      sections:
        - title: project
          fields:
            - name
            - description
            - status
            - owner_id
            - visibility
      help:
        - optctl --project ${project} query optd/projects:project --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query optd/projects:project
      view:
        - optctl --project ${project} view optd/projects:project ${id}
      created:
        - optctl --project ${project} view optd/projects:project ${id}
