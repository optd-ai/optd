{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "project",
  },
  "spec": {
    "fields": {
      "name": {
        "type": "string",
        "required": true,
      },
      "description": {
        "type": "string",
      },
      "status": {
        "type": "string",
        "required": true,
        "enum": [
          "active",
          "on_hold",
          "done",
          "archived",
        ],
      },
      "owner_id": {
        "type": "string",
        "required": true,
      },
      "visibility": {
        "type": "string",
        "required": true,
        "enum": [
          "private",
          "members",
          "internal",
        ],
      },
      "start_date": {
        "type": "date",
      },
      "target_date": {
        "type": "date",
      },
    },
    "axi": {
      "purpose": "Track project ownership, visibility, target dates, and health.",
      "create": {
        "required_fields": [
          "name",
          "status",
          "owner_id",
          "visibility",
        ],
      },
      "list": {
        "fields": [
          "id",
          "name",
          "status",
          "owner_id",
          "target_date",
        ],
      },
      "help": [
        "optctl changeset stage --input create-project.json",
        "optctl query operant/projects:project --where 'status == \"active\"' --fields id,name,status,owner_id",
      ],
    },
  },
}
