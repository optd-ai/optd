kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: task
spec:
  fields:
    title:
      type: string
      required: true
    description:
      type: string
    project_id:
      type: string
      required: true
      ref: optd/projects:project
    stage_id:
      type: string
      required: true
      ref: optd/projects:task_stage
    state:
      type: string
      required: true
      enum:
        - todo
        - in_progress
        - blocked
        - done
    assignee_id:
      type: string
      format: uuid
    priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    deadline:
      type: date
    blocked_reason:
      type: string
    estimated_hours:
      type: decimal
      minimum: "0.00"
      maximum: "999999.99"
      precision: 8
      scale: 2
    spent_hours:
      type: decimal
      minimum: "0.00"
      maximum: "999999.99"
      precision: 8
      scale: 2
  axi:
    purpose: task guidance for the optd/projects pack.
    whenToUse:
      - Use optd/projects:task when working with task records.
    identity:
      title: ${title}
      labelFields:
        - title
    list:
      defaultFields:
        - id
        - title
        - description
        - project_id
        - stage_id
      empty:
        message: No task records found.
        help:
          - optctl --workspace ${workspace} create optd/projects:task --input object.json --stage
    detail:
      sections:
        - title: task
          fields:
            - title
            - description
            - project_id
            - stage_id
            - state
      help:
        - optctl --workspace ${workspace} query optd/projects:task --where 'id == "${id}"'
    help:
      list:
        - optctl --workspace ${workspace} query optd/projects:task
      view:
        - optctl --workspace ${workspace} view optd/projects:task ${id}
      created:
        - optctl --workspace ${workspace} view optd/projects:task ${id}
