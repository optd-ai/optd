kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: task
spec:
  fields:
    title:
      type: string
      required: true
    description:
      type: string
    work_project_id:
      type: string
      required: true
      ref: operant/projects:project
    stage_id:
      type: string
      required: true
      ref: operant/projects:task_stage
    state:
      type: string
      required: true
      enum:
        - todo
        - in_progress
        - blocked
        - done
    assignee_id:
      type: string
      format: uuid
    priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    deadline:
      type: date
    blocked_reason:
      type: string
    estimated_hours:
      type: decimal
      minimum: "0.00"
      maximum: "999999.99"
      precision: 8
      scale: 2
    spent_hours:
      type: decimal
      minimum: "0.00"
      maximum: "999999.99"
      precision: 8
      scale: 2
  axi:
    purpose: task guidance for the operant/projects pack.
    whenToUse:
      - Use operant/projects:task when working with task records.
    identity:
      title: ${title}
      labelFields:
        - title
    list:
      defaultFields:
        - id
        - title
        - description
        - work_project_id
        - stage_id
      empty:
        message: No task records found.
        help:
          - optctl --project ${project} create operant/projects:task --input object.json --stage
    detail:
      sections:
        - title: task
          fields:
            - title
            - description
            - work_project_id
            - stage_id
            - state
      help:
        - optctl --project ${project} query operant/projects:task --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query operant/projects:task
      view:
        - optctl --project ${project} view operant/projects:task ${id}
      created:
        - optctl --project ${project} view operant/projects:task ${id}
