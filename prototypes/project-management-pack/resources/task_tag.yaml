kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: task_tag
spec:
  fields:
    name:
      type: string
      required: true
    color:
      type: string
  constraints:
    - name: task_tag_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: task tag guidance for the optd/projects pack.
    whenToUse:
      - Use optd/projects:task_tag when working with task tag records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - color
      empty:
        message: No task tag records found.
        help:
          - optctl --workspace ${workspace} create optd/projects:task_tag --input object.json --stage
    detail:
      sections:
        - title: task tag
          fields:
            - name
            - color
      help:
        - optctl --workspace ${workspace} query optd/projects:task_tag --where 'id == "${id}"'
    help:
      list:
        - optctl --workspace ${workspace} query optd/projects:task_tag
      view:
        - optctl --workspace ${workspace} view optd/projects:task_tag ${id}
      created:
        - optctl --workspace ${workspace} view optd/projects:task_tag ${id}
