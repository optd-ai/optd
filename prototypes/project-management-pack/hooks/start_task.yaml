kind: Hook
apiVersion: operant.dev/v1
metadata:
  name: start_task
spec:
  script: start_task.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: changeset.operations.v1
  attachments:
    - phase: action.stage
      action: operant/projects:start_task
      order: 100
      input: {}
  axi:
    purpose: start task guidance for the operant/projects pack.
    whenToUse:
      - Inspect hook start_task behavior and guidance before relying on it.
    help:
      - optctl metadata hook operant/projects:start_task
  secrets: []
  effects:
    operations:
      - resource: operant/projects:task
        ops:
          - update
