kind: Hook
apiVersion: operant.dev/v1
metadata:
  name: complete_task
spec:
  script: complete_task.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: changeset.operations.v1
  attachments:
    - phase: action.stage
      action: operant/projects:complete_task
      order: 100
      input:
        action_input: $action.input
        task: $reads.task
  axi:
    purpose: complete task guidance for the operant/projects pack.
    whenToUse:
      - Inspect hook complete_task behavior and guidance before relying on it.
    help:
      - optctl metadata hook operant/projects:complete_task
  secrets: []
  effects:
    operations:
      - resource: operant/projects:task
        ops:
          - transition
      - resource: operant/projects:timesheet_entry
        ops:
          - create
