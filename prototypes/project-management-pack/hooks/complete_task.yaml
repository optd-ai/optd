{
  "kind": "Hook",
  "apiVersion": "operant.dev/v1",
  "metadata": { "name": "complete_task" },
  "spec": {
    "script": "complete_task.ts",
    "timeout": "2s",
    "permissions": {
      "net": false,
      "read": false,
      "write": false,
      "env": false,
      "run": false,
    },
    "output": { "schema": "changeset.operations.v1" },
    "attachments": [
      {
        "phase": "action.preview",
        "action": "default.complete_task",
        "order": 100,
      },
      {
        "phase": "action.commit",
        "action": "default.complete_task",
        "order": 100,
      },
    ],
    "axi": {
      "purpose": "Generate a task update to state=done through the generic changeset path.",
    },
  },
}
