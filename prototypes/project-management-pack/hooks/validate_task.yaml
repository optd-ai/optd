kind: Hook
apiVersion: optd.dev/v1
metadata:
  name: validate_task
spec:
  script: validate_task.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: validation.v1
  attachments:
    - phase: changeset.validate
      resource: optd/projects:task
      order: 100
      input:
        operation: $operation
        workspace_id: $workspace_id
        current: $current
        proposed: $proposed
    - phase: changeset.validate
      resource: optd/projects:timesheet
      order: 100
      input:
        operation: $operation
        workspace_id: $workspace_id
        current: $current
        proposed: $proposed
  axi:
    purpose: Validate task lifecycle and time entries. Authorized humans and agents may complete their own tasks without a separate approval.
    whenToUse:
      - Inspect hook validate_task behavior and guidance before relying on it.
    help:
      - optctl metadata hook optd/projects:validate_task
  secrets: []
  effects:
    operations: []
