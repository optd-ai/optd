{
  "kind": "Hook",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "validate_task",
  },
  "spec": {
    "script": "validate_task.ts",
    "timeout": "2s",
    "permissions": {
      "net": false,
      "read": false,
      "write": false,
      "env": false,
      "run": false,
    },
    "output": {
      "schema": "validation.v1",
    },
    "attachments": [
      {
        "phase": "changeset.validate",
        "resource": "operant/projects:task",
        "order": 100,
        "input": {},
      },
      {
        "phase": "changeset.validate",
        "resource": "operant/projects:timesheet_entry",
        "order": 100,
        "input": {},
      },
    ],
    "axi": {
      "purpose": "Validate task lifecycle invariants and timesheet hour ranges.",
    },
    "secrets": [],
    "effects": {
      "operations": [],
    },
  },
}
