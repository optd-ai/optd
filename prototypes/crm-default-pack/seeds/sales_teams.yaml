kind: Seed
apiVersion: optd.dev/v1
metadata:
  name: sales_teams
spec:
  resource: optd/crm:sales_team
  key: name
  mode: changeset
  rows:
    - name: direct
      label: Direct Sales
      email_alias: sales@example.com
      monthly_target: "50000"
    - name: enterprise
      label: Enterprise Sales
      email_alias: enterprise@example.com
      monthly_target: "250000"
  axi:
    purpose: sales teams guidance for the optd/crm pack.
    whenToUse:
      - Inspect seed sales_teams behavior and guidance before relying on it.
    help:
      - optctl metadata seed optd/crm:sales_teams
