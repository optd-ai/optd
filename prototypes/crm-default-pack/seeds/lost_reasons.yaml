kind: Seed
apiVersion: optd.dev/v1
metadata:
  name: lost_reasons
spec:
  resource: optd/crm:lost_reason
  key: name
  mode: changeset
  rows:
    - name: too_expensive
      label: Too expensive
      active: true
    - name: no_budget
      label: No budget
      active: true
    - name: competitor
      label: Chose competitor
      active: true
    - name: no_response
      label: No response
      active: true
  axi:
    purpose: lost reasons guidance for the optd/crm pack.
    whenToUse:
      - Inspect seed lost_reasons behavior and guidance before relying on it.
    help:
      - optctl metadata seed optd/crm:lost_reasons
