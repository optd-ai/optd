kind: Hook
apiVersion: operant.dev/v1
metadata:
  name: mark_lost
spec:
  script: mark_lost.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: changeset.operations.v1
  attachments:
    - phase: action.stage
      input:
        action_input: $action.input
        actor: $actor
      action: operant/crm:mark_lost
  axi:
    purpose: mark lost guidance for the operant/crm pack.
    whenToUse:
      - Inspect hook mark_lost behavior and guidance before relying on it.
    help:
      - optctl metadata hook operant/crm:mark_lost
  secrets: []
  effects:
    operations:
      - resource: operant/crm:note
        ops:
          - create
      - resource: operant/crm:opportunity
        ops:
          - transition
