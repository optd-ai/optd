kind: Hook
apiVersion: optd.dev/v1
metadata:
  name: notify_crm_change
spec:
  script: notify_crm_change.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: delivery.v1
  attachments:
    - phase: event.after_commit
      event: object.created
      order: 100
      input:
        event: $event
    - phase: event.after_commit
      event: object.updated
      order: 101
      input:
        event: $event
    - phase: event.after_commit
      event: object.transitioned
      order: 102
      input:
        event: $event
    - phase: event.after_commit
      event: object.archived
      order: 103
      input:
        event: $event
  axi:
    purpose: notify crm change guidance for the optd/crm pack.
    whenToUse:
      - Inspect hook notify_crm_change behavior and guidance before relying on it.
    help:
      - optctl metadata hook optd/crm:notify_crm_change
  secrets:
    - slot: crm_webhook_token
      env: CRM_WEBHOOK_TOKEN
  effects:
    operations: []
