kind: Hook
apiVersion: optd.dev/v1
metadata:
  name: mark_won
spec:
  script: mark_won.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: changeset.operations.v1
  attachments:
    - phase: action.stage
      input:
        action_input: $action.input
      action: optd/crm:mark_won
  axi:
    purpose: mark won guidance for the optd/crm pack.
    whenToUse:
      - Inspect hook mark_won behavior and guidance before relying on it.
    help:
      - optctl metadata hook optd/crm:mark_won
  secrets: []
  effects:
    operations:
      - resource: optd/crm:opportunity
        ops:
          - transition
