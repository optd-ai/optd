kind: Hook
apiVersion: optd.dev/v1
metadata:
  name: normalize_lead
spec:
  script: normalize_lead.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: patch.v1
  attachments:
    - phase: changeset.before_stage
      resource: optd/crm:lead
      order: 100
      input:
        operation: $operation
  axi:
    purpose: normalize lead guidance for the optd/crm pack.
    whenToUse:
      - Inspect hook normalize_lead behavior and guidance before relying on it.
    help:
      - optctl metadata hook optd/crm:normalize_lead
  secrets: []
  effects:
    operations: []
