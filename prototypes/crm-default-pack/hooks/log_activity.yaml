kind: Hook
apiVersion: optd.dev/v1
metadata:
  name: log_activity
spec:
  script: log_activity.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: changeset.operations.v1
  attachments:
    - phase: action.stage
      input:
        action_input: $action.input
        actor: $actor
      action: optd/crm:log_activity
  axi:
    purpose: log activity guidance for the optd/crm pack.
    whenToUse:
      - Inspect hook log_activity behavior and guidance before relying on it.
    help:
      - optctl metadata hook optd/crm:log_activity
  secrets: []
  effects:
    operations:
      - resource: optd/crm:activity
        ops:
          - create
      - resource: optd/crm:note
        ops:
          - create
