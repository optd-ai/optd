{
  "kind": "Hook",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "convert_lead",
  },
  "spec": {
    "script": "convert_lead.ts",
    "timeout": "2s",
    "permissions": {
      "net": false,
      "read": false,
      "write": false,
      "env": false,
      "run": false,
    },
    "output": {
      "schema": "changeset.operations.v1",
    },
    "attachments": [
      {
        "phase": "action.stage",
        "action": "operant/crm:convert_lead",
        "order": 100,
        "input": {
          "lead": "$current",
          "input": "$action.input",
        },
      },
    ],
    "axi": {
      "purpose": "convert_lead hook for CRM prototype.",
      "whenToUse": "Runs from metadata-driven attachment points; agents normally invoke actions instead.",
    },
    "secrets": [],
    "effects": {
      "operations": [
        {
          "resource": "operant/crm:company",
          "ops": [
            "create",
          ],
        },
        {
          "resource": "operant/crm:contact",
          "ops": [
            "create",
          ],
        },
        {
          "resource": "operant/crm:opportunity",
          "ops": [
            "create",
          ],
        },
        {
          "resource": "operant/crm:lead",
          "ops": [
            "transition",
          ],
        },
        {
          "resource": "operant/crm:contact_company",
          "ops": [
            "link",
          ],
        },
        {
          "resource": "operant/crm:opportunity_company",
          "ops": [
            "link",
          ],
        },
        {
          "resource": "operant/crm:opportunity_contact",
          "ops": [
            "link",
          ],
        },
      ],
    },
  },
}
