kind: Hook
apiVersion: operant.dev/v1
metadata:
  name: validate_lead
spec:
  script: validate_lead.ts
  timeout: 2s
  permissions:
    net: false
    read: false
    write: false
    env: false
    run: false
  output:
    schema: validation.v1
  attachments:
    - phase: changeset.validate
      resource: operant/crm:lead
      order: 100
      input:
        operation: $operation
        proposed: $proposed
  axi:
    purpose: validate lead guidance for the operant/crm pack.
  secrets: []
  effects:
    operations: []
