kind: Policy
apiVersion: optd.dev/v1
metadata:
  name: sales_access
spec:
  default_assignment: all_projects
  rules:
    - name: direct_opportunity_viewer
      effect: allow
      roles:
        - optd/crm:sales_rep
      actions:
        - read
      resources:
        - optd/crm:opportunity
      relation:
        relationship: optd/crm:opportunity_viewer
        object_side: from
        subject_side: to
        subject: actor.id
      axi:
        summary: A sales representative may read an opportunity linked directly to their principal.
    - name: crm_admin_access_1
      effect: allow
      roles:
        - optd/crm:crm_admin
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - link
        - unlink
        - comment
      resources:
        - optd/crm:company
        - optd/crm:sales_team
        - optd/crm:task
        - optd/crm:activity
        - optd/crm:note
        - optd/crm:lead_status
        - optd/crm:contact
        - optd/crm:lost_reason
        - optd/crm:lead
        - optd/crm:opportunity
        - optd/crm:opportunity_stage
        - optd/crm:activity_type
      axi:
        summary: CRM administrators may manage every CRM resource.
    - name: crm_admin_relationship_links
      effect: allow
      roles:
        - optd/crm:crm_admin
      actions:
        - link
        - unlink
      resources:
        - optd/crm:activity_contact
        - optd/crm:activity_lead
        - optd/crm:activity_opportunity
        - optd/crm:contact_company
        - optd/crm:note_lead
        - optd/crm:opportunity_company
        - optd/crm:opportunity_contact
        - optd/crm:opportunity_viewer
        - optd/crm:task_opportunity
      axi:
        summary: CRM administrators may create and remove every CRM relationship.
    - name: sales_manager_approval
      effect: allow
      roles:
        - optd/crm:sales_manager
      actions:
        - changeset.approval.decide
      resources:
        - system:changeset-approval
      axi:
        summary: Sales managers may decide changeset approval requirements.
    - name: sales_manager_access_2
      effect: allow
      roles:
        - optd/crm:sales_manager
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - comment
        - action:optd/crm:mark_lost
        - action:optd/crm:log_activity
        - action:optd/crm:mark_won
        - action:optd/crm:convert_lead
      resources:
        - optd/crm:company
        - optd/crm:sales_team
        - optd/crm:task
        - optd/crm:activity
        - optd/crm:note
        - optd/crm:lead_status
        - optd/crm:contact
        - optd/crm:lost_reason
        - optd/crm:lead
        - optd/crm:opportunity
        - optd/crm:opportunity_stage
        - optd/crm:activity_type
      where: "true"
      axi:
        summary: Sales managers may manage CRM resources and invoke CRM actions.
    - name: sales_rep_access_3
      effect: allow
      roles:
        - optd/crm:sales_rep
      actions:
        - read
        - create
        - update
        - archive
        - transition
        - comment
        - action:optd/crm:mark_lost
        - action:optd/crm:log_activity
        - action:optd/crm:mark_won
        - action:optd/crm:convert_lead
      resources:
        - optd/crm:company
        - optd/crm:sales_team
        - optd/crm:task
        - optd/crm:activity
        - optd/crm:lead_status
        - optd/crm:contact
        - optd/crm:lost_reason
        - optd/crm:lead
        - optd/crm:opportunity
        - optd/crm:opportunity_stage
        - optd/crm:activity_type
      where: owner_id == actor.id
      axi:
        summary: Sales representatives may manage CRM records owned by their principal.
    - name: sales_rep_notes
      effect: allow
      roles:
        - optd/crm:sales_rep
      actions:
        - read
        - create
        - update
        - archive
        - comment
        - action:optd/crm:log_activity
      resources:
        - optd/crm:note
      where: author_id == actor.id
      axi:
        summary: Sales representatives may manage CRM notes authored by their principal.
  axi:
    purpose: sales access guidance for the optd/crm pack.
    whenToUse:
      - Inspect policy sales_access behavior and guidance before relying on it.
    help:
      - optctl metadata policy optd/crm:sales_access
