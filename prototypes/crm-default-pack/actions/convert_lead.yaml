{
  "kind": "Action",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "convert_lead",
  },
  "spec": {
    "input": {
      "lead_id": {
        "type": "string",
        "required": true,
        "format": "uuid",
      },
    },
    "reads": {
      "lead": {
        "resource": "lead",
        "id_from": "input.lead_id",
        "required": true,
      },
    },
    "axi": {
      "purpose": "Convert a qualified lead into company, contact, and opportunity records.",
      "help": [
        "optctl action stage operant/crm:convert_lead --input ...",
      ],
    },
  },
}
