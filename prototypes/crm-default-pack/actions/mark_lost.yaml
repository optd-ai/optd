{
  "kind": "Action",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "mark_lost",
  },
  "spec": {
    "input": {
      "opportunity_id": {
        "type": "string",
        "required": true,
        "format": "uuid",
      },
      "lost_reason_id": {
        "type": "string",
        "required": true,
        "format": "uuid",
      },
      "note": {
        "type": "string",
        "required": true,
      },
    },
    "axi": {
      "purpose": "Mark an opportunity as lost with a reason.",
      "help": [
        "optctl action stage operant/crm:mark_lost --input ...",
      ],
    },
  },
}
