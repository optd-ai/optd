kind: Action
apiVersion: optd.dev/v1
metadata:
  name: mark_won
spec:
  input:
    opportunity_id:
      type: string
      required: true
      format: uuid
    expected_version:
      type: integer
      required: true
      minimum: 1
  axi:
    purpose: mark won guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:mark_won when its declared operation should be staged.
    stageFirst: true
    examples:
      - optctl --project ${project} action stage optd/crm:mark_won --input action.json
    successHelp:
      - optctl changeset inspect ${stage_id}
