kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: company
spec:
  fields:
    name:
      type: string
      required: true
    website:
      type: string
    email:
      type: string
    phone:
      type: string
    industry:
      type: string
    owner_id:
      type: string
  axi:
    purpose: company guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:company when working with company records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - website
        - email
        - phone
      empty:
        message: No company records found.
        help:
          - optctl --workspace ${workspace} create optd/crm:company --input object.json --stage
    detail:
      sections:
        - title: company
          fields:
            - name
            - website
            - email
            - phone
            - industry
      help:
        - optctl --workspace ${workspace} query optd/crm:company --where 'id == "${id}"'
    help:
      list:
        - optctl --workspace ${workspace} query optd/crm:company
      view:
        - optctl --workspace ${workspace} view optd/crm:company ${id}
      created:
        - optctl --workspace ${workspace} view optd/crm:company ${id}
