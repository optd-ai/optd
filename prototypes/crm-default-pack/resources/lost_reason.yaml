kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: lost_reason
spec:
  fields:
    name:
      type: string
      required: true
    label:
      type: string
      required: true
    active:
      type: boolean
  constraints:
    - name: lost_reason_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: lost reason guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:lost_reason when working with lost reason records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - label
        - active
      empty:
        message: No lost reason records found.
        help:
          - optctl --workspace ${workspace} create optd/crm:lost_reason --input object.json --stage
    detail:
      sections:
        - title: lost reason
          fields:
            - name
            - label
            - active
      help:
        - optctl --workspace ${workspace} query optd/crm:lost_reason --where 'id == "${id}"'
    help:
      list:
        - optctl --workspace ${workspace} query optd/crm:lost_reason
      view:
        - optctl --workspace ${workspace} view optd/crm:lost_reason ${id}
      created:
        - optctl --workspace ${workspace} view optd/crm:lost_reason ${id}
