kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: lead_status
spec:
  fields:
    name:
      type: string
      required: true
    label:
      type: string
      required: true
    sort_order:
      type: integer
      required: true
    terminal:
      type: boolean
  constraints:
    - name: lead_status_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: lead status guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:lead_status when working with lead status records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - label
        - sort_order
        - terminal
      empty:
        message: No lead status records found.
        help:
          - optctl --project ${project} create optd/crm:lead_status --input object.json --stage
    detail:
      sections:
        - title: lead status
          fields:
            - name
            - label
            - sort_order
            - terminal
      help:
        - optctl --project ${project} query optd/crm:lead_status --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query optd/crm:lead_status
      view:
        - optctl --project ${project} view optd/crm:lead_status ${id}
      created:
        - optctl --project ${project} view optd/crm:lead_status ${id}
