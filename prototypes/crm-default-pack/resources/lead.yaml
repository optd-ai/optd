{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "lead"
  },
  "spec": {
    "fields": {
      "name": {
        "type": "string",
        "required": true
      },
      "email": {
        "type": "string"
      },
      "phone": {
        "type": "string"
      },
      "company_name": {
        "type": "string"
      },
      "source": {
        "type": "string"
      },
      "score": {
        "type": "integer"
      },
      "status": {
        "type": "string",
        "required": true
      },
      "owner_id": {
        "type": "string"
      },
      "sales_team_id": {
        "type": "string",
        "ref": "operant/crm:sales_team"
      },
      "lost_reason_id": {
        "type": "string",
        "ref": "operant/crm:lost_reason"
      },
      "next_activity_at": {
        "type": "timestamp"
      }
    },
    "axi": {
      "list": {
        "fields": [
          "id",
          "name",
          "email",
          "phone"
        ]
      },
      "help": [
        "optctl query operant/crm:lead",
        "optctl metadata resource operant/crm:lead"
      ]
    }
  }
}
