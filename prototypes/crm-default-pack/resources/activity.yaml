{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "activity"
  },
  "spec": {
    "fields": {
      "subject": {
        "type": "string",
        "required": true
      },
      "type": {
        "type": "string",
        "required": true
      },
      "status": {
        "type": "string",
        "required": true
      },
      "due_at": {
        "type": "timestamp"
      },
      "completed_at": {
        "type": "timestamp"
      },
      "owner_id": {
        "type": "string"
      },
      "lead_id": {
        "type": "string",
        "ref": "operant/crm:lead"
      },
      "opportunity_id": {
        "type": "string",
        "ref": "operant/crm:opportunity"
      },
      "contact_id": {
        "type": "string",
        "ref": "operant/crm:contact"
      }
    },
    "axi": {
      "list": {
        "fields": [
          "id",
          "subject",
          "type",
          "status"
        ]
      },
      "help": [
        "optctl query operant/crm:activity",
        "optctl metadata resource operant/crm:activity"
      ]
    }
  }
}
