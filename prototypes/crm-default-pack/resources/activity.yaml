kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: activity
spec:
  fields:
    subject:
      type: string
      required: true
    type:
      type: string
      required: true
    status:
      type: string
      required: true
    due_at:
      type: timestamp
    completed_at:
      type: timestamp
    owner_id:
      type: string
    lead_id:
      type: string
      ref: optd/crm:lead
    opportunity_id:
      type: string
      ref: optd/crm:opportunity
    contact_id:
      type: string
      ref: optd/crm:contact
  axi:
    purpose: activity guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:activity when working with activity records.
    identity:
      title: ${subject}
      labelFields:
        - subject
    list:
      defaultFields:
        - id
        - subject
        - type
        - status
        - due_at
      empty:
        message: No activity records found.
        help:
          - optctl --project ${project} create optd/crm:activity --input object.json --stage
    detail:
      sections:
        - title: activity
          fields:
            - subject
            - type
            - status
            - due_at
            - completed_at
      help:
        - optctl --project ${project} query optd/crm:activity --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query optd/crm:activity
      view:
        - optctl --project ${project} view optd/crm:activity ${id}
      created:
        - optctl --project ${project} view optd/crm:activity ${id}
