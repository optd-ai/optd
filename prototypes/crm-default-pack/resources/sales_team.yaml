kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: sales_team
spec:
  fields:
    name:
      type: string
      required: true
    label:
      type: string
    leader_id:
      type: string
    email_alias:
      type: string
    monthly_target:
      type: decimal
  constraints:
    - name: sales_team_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: sales team guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:sales_team when working with sales team records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - label
        - leader_id
        - email_alias
      empty:
        message: No sales team records found.
        help:
          - optctl --project ${project} create optd/crm:sales_team --input object.json --stage
    detail:
      sections:
        - title: sales team
          fields:
            - name
            - label
            - leader_id
            - email_alias
            - monthly_target
      help:
        - optctl --project ${project} query optd/crm:sales_team --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query optd/crm:sales_team
      view:
        - optctl --project ${project} view optd/crm:sales_team ${id}
      created:
        - optctl --project ${project} view optd/crm:sales_team ${id}
