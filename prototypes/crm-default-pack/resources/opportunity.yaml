{
  "kind": "Resource",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "name": "opportunity"
  },
  "spec": {
    "fields": {
      "name": {
        "type": "string",
        "required": true
      },
      "stage": {
        "type": "string",
        "required": true
      },
      "expected_revenue": {
        "type": "decimal"
      },
      "probability": {
        "type": "integer"
      },
      "company_id": {
        "type": "string",
        "ref": "operant/crm:company"
      },
      "contact_id": {
        "type": "string",
        "ref": "operant/crm:contact"
      },
      "lead_id": {
        "type": "string",
        "ref": "operant/crm:lead"
      },
      "sales_team_id": {
        "type": "string",
        "ref": "operant/crm:sales_team"
      },
      "owner_id": {
        "type": "string"
      },
      "lost_reason_id": {
        "type": "string",
        "ref": "operant/crm:lost_reason"
      },
      "close_date": {
        "type": "timestamp"
      }
    },
    "axi": {
      "list": {
        "fields": [
          "id",
          "name",
          "stage",
          "expected_revenue"
        ]
      },
      "help": [
        "optctl query operant/crm:opportunity",
        "optctl metadata resource operant/crm:opportunity"
      ]
    }
  }
}
