kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: opportunity
spec:
  fields:
    name:
      type: string
      required: true
    stage:
      type: string
      required: true
    expected_revenue:
      type: decimal
    probability:
      type: integer
    company_id:
      type: string
      ref: operant/crm:company
    contact_id:
      type: string
      ref: operant/crm:contact
    lead_id:
      type: string
      ref: operant/crm:lead
    sales_team_id:
      type: string
      ref: operant/crm:sales_team
    owner_id:
      type: string
    lost_reason_id:
      type: string
      ref: operant/crm:lost_reason
    close_date:
      type: timestamp
  axi:
    purpose: opportunity guidance for the operant/crm pack.
    whenToUse:
      - Use operant/crm:opportunity when working with opportunity records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - stage
        - expected_revenue
        - probability
      empty:
        message: No opportunity records found.
        help:
          - optctl --project ${project} create operant/crm:opportunity --input object.json --stage
    detail:
      sections:
        - title: opportunity
          fields:
            - name
            - stage
            - expected_revenue
            - probability
            - company_id
      help:
        - optctl --project ${project} query operant/crm:opportunity --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query operant/crm:opportunity
      view:
        - optctl --project ${project} view operant/crm:opportunity ${id}
      created:
        - optctl --project ${project} view operant/crm:opportunity ${id}
