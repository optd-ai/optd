kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: opportunity_stage
spec:
  fields:
    name:
      type: string
      required: true
    label:
      type: string
      required: true
    probability:
      type: integer
    sort_order:
      type: integer
      required: true
    terminal:
      type: boolean
  constraints:
    - name: opportunity_stage_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: opportunity stage guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:opportunity_stage when working with opportunity stage records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - label
        - probability
        - sort_order
      empty:
        message: No opportunity stage records found.
        help:
          - optctl --workspace ${workspace} create optd/crm:opportunity_stage --input object.json
            --stage
    detail:
      sections:
        - title: opportunity stage
          fields:
            - name
            - label
            - probability
            - sort_order
            - terminal
      help:
        - optctl --workspace ${workspace} query optd/crm:opportunity_stage --where 'id == "${id}"'
    help:
      list:
        - optctl --workspace ${workspace} query optd/crm:opportunity_stage
      view:
        - optctl --workspace ${workspace} view optd/crm:opportunity_stage ${id}
      created:
        - optctl --workspace ${workspace} view optd/crm:opportunity_stage ${id}
