kind: Resource
apiVersion: operant.dev/v1
metadata:
  name: activity_type
spec:
  fields:
    name:
      type: string
      required: true
    label:
      type: string
      required: true
    default_deadline_days:
      type: integer
  constraints:
    - name: activity_type_active_name
      kind: unique
      fields: [name]
      where: active()
  axi:
    purpose: activity type guidance for the operant/crm pack.
    whenToUse:
      - Use operant/crm:activity_type when working with activity type records.
    identity:
      title: ${name}
      labelFields:
        - name
    list:
      defaultFields:
        - id
        - name
        - label
        - default_deadline_days
      empty:
        message: No activity type records found.
        help:
          - optctl --project ${project} create operant/crm:activity_type --input object.json --stage
    detail:
      sections:
        - title: activity type
          fields:
            - name
            - label
            - default_deadline_days
      help:
        - optctl --project ${project} query operant/crm:activity_type --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query operant/crm:activity_type
      view:
        - optctl --project ${project} view operant/crm:activity_type ${id}
      created:
        - optctl --project ${project} view operant/crm:activity_type ${id}
