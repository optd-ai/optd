kind: Resource
apiVersion: optd.dev/v1
metadata:
  name: note
spec:
  fields:
    body:
      type: string
      required: true
    author_id:
      type: string
    lead_id:
      type: string
      ref: optd/crm:lead
    opportunity_id:
      type: string
      ref: optd/crm:opportunity
    contact_id:
      type: string
      ref: optd/crm:contact
    company_id:
      type: string
      ref: optd/crm:company
  axi:
    purpose: note guidance for the optd/crm pack.
    whenToUse:
      - Use optd/crm:note when working with note records.
    identity:
      title: ${body}
      labelFields:
        - body
    list:
      defaultFields:
        - id
        - body
        - author_id
        - lead_id
        - opportunity_id
      empty:
        message: No note records found.
        help:
          - optctl --project ${project} create optd/crm:note --input object.json --stage
    detail:
      sections:
        - title: note
          fields:
            - body
            - author_id
            - lead_id
            - opportunity_id
            - contact_id
      help:
        - optctl --project ${project} query optd/crm:note --where 'id == "${id}"'
    help:
      list:
        - optctl --project ${project} query optd/crm:note
      view:
        - optctl --project ${project} view optd/crm:note ${id}
      created:
        - optctl --project ${project} view optd/crm:note ${id}
