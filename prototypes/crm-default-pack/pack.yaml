kind: Pack
apiVersion: optd.dev/v1
metadata:
  publisher: optd
  name: crm
  version: 0.1.0
spec:
  purpose: Prototype headless CRM pack for leads, contacts, companies, opportunities, activities,
    tasks, and safe agent operations.
  axi:
    purpose: Prototype headless CRM pack for leads, contacts, companies, opportunities, activities,
      tasks, and safe agent operations.
    home:
      resources:
        - optd/crm:activity
        - optd/crm:activity_type
        - optd/crm:company
        - optd/crm:contact
        - optd/crm:lead
        - optd/crm:lead_status
        - optd/crm:lost_reason
        - optd/crm:note
        - optd/crm:opportunity
        - optd/crm:opportunity_stage
        - optd/crm:sales_team
        - optd/crm:task
      actions:
        - optd/crm:convert_lead
        - optd/crm:log_activity
        - optd/crm:mark_lost
        - optd/crm:mark_won
      help:
        - optctl resources
        - optctl --project ${project} query optd/crm:activity
        - optctl metadata pack optd/crm
