{
  "kind": "Pack",
  "apiVersion": "operant.dev/v1",
  "metadata": {
    "publisher": "operant",
    "name": "crm",
    "version": "0.1.0",
  },
  "spec": {
    "purpose": "Prototype headless CRM pack for leads, contacts, companies, opportunities, activities, tasks, and safe agent operations.",
    "axi": {
      "home": {
        "resources": [
          "operant/crm:lead",
          "operant/crm:opportunity",
          "operant/crm:contact",
          "operant/crm:company",
          "operant/crm:activity",
        ],
        "actions": [
          "operant/crm:convert_lead",
          "operant/crm:mark_won",
          "operant/crm:mark_lost",
          "operant/crm:log_activity",
        ],
        "help": [
          "optctl query operant/crm:lead --where 'active()'",
          "optctl action stage operant/crm:convert_lead --input lead_123",
          "optctl metadata resource operant/crm:opportunity",
        ],
      },
    },
  },
}
