{
  "kind": "Pack",
  "apiVersion": "operant.dev/v1",
  "metadata": { "namespace": "default", "name": "crm", "version": "0.1.0" },
  "spec": {
    "purpose": "Prototype headless CRM pack for leads, contacts, companies, opportunities, activities, tasks, and safe agent operations.",
    "axi": {
      "home": {
        "resources": [
          "default.lead",
          "default.opportunity",
          "default.contact",
          "default.company",
          "default.activity",
        ],
        "actions": [
          "default.convert_lead",
          "default.mark_won",
          "default.mark_lost",
          "default.log_activity",
        ],
        "help": [
          "optctl query default.lead --where 'active()'",
          "optctl action preview default.convert_lead --input lead_123",
          "optctl metadata resource default.opportunity",
        ],
      },
    },
  },
}
