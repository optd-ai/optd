kind: Relationship
apiVersion: optd.dev/v1
metadata:
  name: opportunity_viewer
spec:
  from:
    resource: optd/crm:opportunity
  to:
    resource: system:principal
  unique:
    - from
    - to
  axi:
    purpose: Grants one principal direct read access to one opportunity.
    whenToUse:
      - Link an opportunity to a principal when direct viewer access is required.
    help:
      - optctl metadata relationship optd/crm:opportunity_viewer
