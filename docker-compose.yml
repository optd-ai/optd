services:
  operant:
    build:
      context: .
      args:
        OPERANT_VERSION: ${OPERANT_VERSION:-0.1.0-dev}
        OPERANT_REVISION: ${OPERANT_REVISION:-unknown}
        OPERANT_SOURCE: ${OPERANT_SOURCE:-https://github.com/from-nibly/operant}
    image: operant:${OPERANT_VERSION:-dev}
    init: false
    stop_grace_period: 30s
    ports:
      - "${OPERANT_PORT:-8789}:8789"
    environment:
      OPERANT_HOST: 0.0.0.0
      OPERANT_PORT: 8789
      OPERANT_DATA_DIR: /data
      OPERANT_BOOTSTRAP_TOKEN: ${OPERANT_BOOTSTRAP_TOKEN:?set a generated bootstrap token}
      OPERANT_SECRET_MASTER_KEY: ${OPERANT_SECRET_MASTER_KEY:?set canonical base64 for exactly 32 generated bytes}
    volumes:
      - operant-data:/data
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8789/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  operant-data:
