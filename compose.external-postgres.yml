services:
  operant:
    build:
      context: .
      args:
        OPERANT_VERSION: ${OPERANT_VERSION:-0.1.0-dev}
        OPERANT_REVISION: ${OPERANT_REVISION:-unknown}
        OPERANT_SOURCE: ${OPERANT_SOURCE:-https://github.com/from-nibly/operant}
    image: operant:${OPERANT_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    ports:
      - "${OPERANT_PORT:-8789}:8789"
    environment:
      OPERANT_HOST: 0.0.0.0
      OPERANT_PORT: 8789
      OPERANT_DATA_DIR: /tmp/operant
      OPERANT_DATABASE_URL: postgres://operant:${OPERANT_POSTGRES_PASSWORD:?set a generated database password}@postgres:5432/operant
      OPERANT_BOOTSTRAP_TOKEN: ${OPERANT_BOOTSTRAP_TOKEN:?set a generated bootstrap token}
      OPERANT_SECRET_MASTER_KEY: ${OPERANT_SECRET_MASTER_KEY:?set canonical base64 for exactly 32 generated bytes}
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8789/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: operant
      POSTGRES_USER: operant
      POSTGRES_PASSWORD: ${OPERANT_POSTGRES_PASSWORD:?set a generated database password}
    volumes:
      - operant-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operant -d operant"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  operant-postgres:
