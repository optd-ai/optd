services:
  optd:
    build:
      context: .
      args:
        OPTD_VERSION: ${OPTD_VERSION:-0.1.0-dev}
        OPTD_REVISION: ${OPTD_REVISION:-unknown}
        OPTD_SOURCE: ${OPTD_SOURCE:-https://github.com/optd-ai/optd}
    image: ${OPTD_IMAGE:-optd:${OPTD_VERSION:-dev}}
    labels:
      dev.optd.release-gate: ${OPTD_RELEASE_GATE_ID:-standalone}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    ports:
      - "${OPTD_PORT:-8789}:8789"
    environment:
      OPTD_HOST: 0.0.0.0
      OPTD_PORT: 8789
      OPTD_DATA_DIR: /tmp/optd
      OPTD_DATABASE_URL: postgres://optd:${OPTD_POSTGRES_PASSWORD:?set a generated database password}@postgres:5432/optd
      OPTD_BOOTSTRAP_TOKEN: ${OPTD_BOOTSTRAP_TOKEN:?set a generated bootstrap token}
      OPTD_SECRET_MASTER_KEY: ${OPTD_SECRET_MASTER_KEY:?set canonical base64 for exactly 32 generated bytes}
    volumes:
      - optd-data:/data
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "const r=await fetch('http://127.0.0.1:8789/ready');if(!r.ok)Deno.exit(1)",
      ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    labels:
      dev.optd.release-gate: ${OPTD_RELEASE_GATE_ID:-standalone}
    environment:
      POSTGRES_DB: optd
      POSTGRES_USER: optd
      POSTGRES_PASSWORD: ${OPTD_POSTGRES_PASSWORD:?set a generated database password}
    volumes:
      - optd-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optd -d optd"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  optd-data:
    labels:
      dev.optd.release-gate: ${OPTD_RELEASE_GATE_ID:-standalone}
  optd-postgres:
    labels:
      dev.optd.release-gate: ${OPTD_RELEASE_GATE_ID:-standalone}

networks:
  default:
    labels:
      dev.optd.release-gate: ${OPTD_RELEASE_GATE_ID:-standalone}
